services:
  app:
    build: .
    env_file: .env.local
    environment:
      MEDIA_REGISTRY_PATH: /app/catalog/bdix-sources.json
    volumes:
      - catalog:/app/catalog
    restart: unless-stopped
  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
volumes:
  catalog:
